name: Check and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Verify mise tools are available in the shell
        run: |
          node --version
          bun --version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://${{ vars.TRAINSTACK_DOMAIN || 'trainstackhq.com' }}
    concurrency:
      group: trainstack-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - name: Verify mise tools are available in the shell
        run: |
          node --version
          bun --version
      - run: bun install --frozen-lockfile
      - name: Check this revision is still main
        id: revision
        run: |
          current_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit is on main; skipping this deployment."
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy infrastructure, migrations, and applications
        if: steps.revision.outputs.current == 'true'
        working-directory: hosted/infra
        run: |
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN BETTER_AUTH_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing production configuration: $name"
              exit 1
            fi
          done
          bun run deploy --stage production --yes --no-input
        env:
          CI: "true"
          NODE_ENV: production
          TRAINSTACK_DOMAIN: ${{ vars.TRAINSTACK_DOMAIN || 'trainstackhq.com' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          STRAVA_CLIENT_ID: ${{ vars.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          GITHUB_FEEDBACK_TOKEN: ${{ secrets.GITHUB_FEEDBACK_TOKEN }}
          APPLE_SIGN_IN_KEY_ID: ${{ vars.APPLE_SIGN_IN_KEY_ID }}
          APPLE_SIGN_IN_PRIVATE_KEY: ${{ secrets.APPLE_SIGN_IN_PRIVATE_KEY }}
          AXIOM_TOKEN: ${{ secrets.AXIOM_TOKEN }}
          AXIOM_ORG_ID: ${{ vars.AXIOM_ORG_ID }}
      - name: Verify production
        if: steps.revision.outputs.current == 'true'
        env:
          DOMAIN: ${{ vars.TRAINSTACK_DOMAIN || 'trainstackhq.com' }}
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 \
            "https://api.$DOMAIN/health" | jq --exit-status '.status == "ok"'
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 \
            "https://$DOMAIN/" --output /dev/null
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 \
            "https://$DOMAIN/help/getting-started" | grep --fixed-strings '>Getting started</h1>'
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 \
            "https://account.$DOMAIN/" | grep --fixed-strings '<title>Trainstack</title>'
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors --max-time 15 \
            --header "Origin: https://account.$DOMAIN" --dump-header - --output /dev/null \
            "https://api.$DOMAIN/api/auth/get-session" \
            | tr -d '\r' | grep --ignore-case --fixed-strings "access-control-allow-origin: https://account.$DOMAIN"
