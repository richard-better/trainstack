name: Ride release

# Archives Ride and uploads it to App Store Connect, where it appears in TestFlight once Apple
# has processed it, and publishes the Developer ID build that Homebrew installs as release
# `ride-v<version>`. Run it by hand from the Actions tab. See docs/ride-release.md for the
# one-time setup.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version, such as 1.0.1.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ride-release
  cancel-in-progress: false

jobs:
  upload:
    name: Upload (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 45
    environment: testflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS
          - platform: macOS
            destination: generic/platform=macOS
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check the App Store Connect key is configured
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set on the testflight environment. See docs/ride-release.md."
              exit 1
            fi
          done
      - name: Check the version
        run: |
          if ! [[ "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected version $INPUT_VERSION. Use one like 1.0.1."
            exit 1
          fi
      - name: Write the App Store Connect key
        run: |
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        run: |
          # App Store Connect needs each upload's build number to be higher than the last, so
          # use the UTC time, which also keeps the iOS and macOS builds of one release apart.
          build="$(date -u +%y%m%d%H%M)"
          xcodebuild archive \
            -project apps/ride/Ride.xcodeproj \
            -scheme Ride \
            -destination '${{ matrix.destination }}' \
            -archivePath "$RUNNER_TEMP/Ride.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$build" \
            MARKETING_VERSION="$INPUT_VERSION"
      - name: Upload to App Store Connect
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/Ride.xcarchive"
          -exportPath "$RUNNER_TEMP/export"
          -exportOptionsPlist apps/ride/ExportOptions.plist
          -allowProvisioningUpdates
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID"
          -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  homebrew:
    permissions:
      contents: write
    uses: ./.github/workflows/ride-homebrew.yml
    with:
      channel: stable
      version: ${{ inputs.version }}
    secrets: inherit
