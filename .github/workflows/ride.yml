name: Ride

on:
  pull_request:
    branches: [main]
    paths: ["apps/ride/**", ".github/workflows/ride.yml"]
  push:
    branches: [main]
    paths: ["apps/ride/**", ".github/workflows/ride.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocols:
    name: Protocol model checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Check protocols with TLC
        run: apps/ride/Specs/check.sh

  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Format
        working-directory: apps/ride
        run: swift format lint --strict --recursive --parallel Ride RideWatch RideKit Lint
      - name: Test the lint rules
        run: swift test --package-path apps/ride/Lint
      - name: Lint
        working-directory: apps/ride
        run: swift run --package-path Lint ride-lint Ride RideWatch RideKit Lint

  build:
    name: Build (${{ matrix.platform }})
    runs-on: xcode-27
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            destination: generic/platform=iOS Simulator
          - platform: macOS
            destination: platform=macOS,arch=arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: >
          xcodebuild build
          -project apps/ride/Ride.xcodeproj
          -scheme Ride
          -destination '${{ matrix.destination }}'
          CODE_SIGNING_ALLOWED=NO
      - name: Test
        if: matrix.platform == 'macOS'
        run: swift test --package-path apps/ride/RideKit
